<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Chetan Rajput | Portfolio</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: radial-gradient(circle at top, #0f2027, #000);
            color: white;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 40px;
            background: black;
            border-bottom: 1px solid rgb(34, 0, 255);
        }

        nav h1 {
            color: rgb(25, 0, 255);
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
        }

        nav a:hover {
            color: rgb(8, 0, 255);
        }

        .profile {
            text-align: center;
            padding: 60px 20px;
        }

        .profile img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 3px solid rgb(51, 0, 255);
            object-fit: cover;
            margin-bottom: 15px;
        }

        .profile h2 {
            margin-bottom: 5px;
        }

        .profile p {
            color: #aaa;
            margin-bottom: 20px;
        }

        .social a {
            display: inline-block;
            margin: 5px;
            padding: 8px 15px;
            border: 1px solid rgb(60, 0, 255);
            color: rgb(60, 0, 255);
            text-decoration: none;
            border-radius: 6px;
            transition: 0.3s;
        }

        .social a:hover {
            background: rgb(60, 0, 255);
            color: black;
        }

        .projects {
            text-align: center;
            padding: 60px 20px;
        }

        .projects h2 {
            margin-bottom: 30px;
        }

        .project-card {
            width: 300px;
            margin: auto;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgb(60, 0, 255);
            border-radius: 12px;
            padding: 15px;
            transition: 0.3s;
        }

        .project-card:hover {
            transform: scale(1.05);
        }

        .project-card img {
            width: 100%;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .project-card h3 {
            color: rgb(13, 0, 255);
        }

        .project-card p {
            font-size: 14px;
            color: #ccc;
            margin-bottom: 10px;
        }

        .project-card a {
            display: inline-block;
            padding: 6px 12px;
            border: 1px solid rgb(60, 0, 255);
            color: rgb(60, 0, 255);
            text-decoration: none;
            border-radius: 6px;
        }

        .project-card a:hover {
            background: rgb(60, 0, 255);
            color: black;
        }

        footer {
            text-align: center;
            padding: 20px;
            background: black;
            border-top: 1px solid rgb(60, 0, 255);
            font-size: 14px;
        }
    </style>
</head>

<body>

    <nav>
        <h1>Chetan Rajput</h1>
        <div>
            <a href="#home">Home</a>
            <a href="#projects">Projects</a>
            <a href="#contact">Contact</a>
        </div>
    </nav>

    <section id="home" class="profile">
        <img src="my photo.jpeg" alt="Chetan Rajput">

        <h2>Chetan Rajput</h2>
        <p>Student | Web Developer | Programmer</p>

        <div class="social">
            <a href="https://github.com/chetanrajput11may" target="_blank">GitHub</a>
            <a href="https://www.linkedin.com/in/chetan-rajput-19b144381" target="_blank">LinkedIn</a>
        </div>
    </section>

   
    <section id="projects" class="projects">
        <h2>My Project</h2>

        <div class="project-card">
            <img src="project.jpeg" alt=" Smart Gallery">
            <h3>Smart Gallery</h3>
            <p>Manage Your Photos Efficiently </p>
            <a href="https://www.linkedin.com/in/chetan-rajput-19b144381" target="_blank">
                View on LinkedIn
            </a>
        </div>
    </section>

    <footer id="contact">
        © 2026 Chetan Rajput | All Rights Reserved
    </footer>

</body>
</html>
